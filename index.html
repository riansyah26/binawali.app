<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinaWali - SMP Muhammadiyah 3 Bandar Lampung</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts CDN Dependencies -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        @media print {
            .print\:hidden { display: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:border-none { border: none !important; }
            .print\:p-0 { padding: 0 !important; }
            body { background-color: white !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                users: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
                book: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>,
                award: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>,
                star: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>,
                calendar: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
                fileText: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
                chart: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>,
                plus: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>,
                save: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>,
                trash: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
                user: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
                printer: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>,
                settings: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            };
            return icons[name] || null;
        };

        const ASPEK_PEMBINAAN = {
            kompetensi: { id: 'kompetensi', label: 'Kompetensi', iconName: 'award', color: '#16a34a', bgColor: 'bg-green-100', text: 'text-green-700' },
            akademik: { id: 'akademik', label: 'Akademik', iconName: 'book', color: '#0284c7', bgColor: 'bg-sky-100', text: 'text-sky-700' },
            karakter: { id: 'karakter', label: 'Karakter', iconName: 'star', color: '#d97706', bgColor: 'bg-amber-100', text: 'text-amber-700' },
            keterampilan: { id: 'keterampilan', label: 'Keterampilan', iconName: 'settings', color: '#9333ea', bgColor: 'bg-purple-100', text: 'text-purple-700' }
        };

        const INDIKATOR_PRESET = {
            kompetensi: ['Kepemimpinan', 'Kerja Sama Tim', 'Pemecahan Masalah', 'Komunikasi Efektif', 'Berpikir Kritis'],
            akademik: ['Peningkatan Nilai Ulangan', 'Kedisiplinan Mengerjakan Tugas', 'Keaktifan Bertanya di Kelas', 'Kemampuan Membaca/Literasi', 'Penguasaan Materi Dasar'],
            karakter: ['Kedisiplinan Waktu (Hadir)', 'Ibadah Yaumiyah', 'Sopan Santun & Etika', 'Kejujuran', 'Tanggung Jawab'],
            keterampilan: ['Keterampilan IT Dasar', 'Public Speaking', 'Karya Seni/Prakarya', 'Olahraga', 'Kecakapan Hidup (Pramuka/UKS)']
        };

        const INITIAL_STUDENTS = [
            { id: 'S001', name: 'Ahmad Fauzi', nis: '2324001' },
            { id: 'S002', name: 'Budi Santoso', nis: '2324002' },
            { id: 'S003', name: 'Citra Kirana', nis: '2324003' },
            { id: 'S004', name: 'Dewi Lestari', nis: '2324004' },
            { id: 'S005', name: 'Eko Prasetyo', nis: '2324005' },
        ];

        const TRIWULAN = [
            { id: 'Q1', label: 'Triwulan 1 (Jan-Mar)', months: [0, 1, 2] },
            { id: 'Q2', label: 'Triwulan 2 (Apr-Jun)', months: [3, 4, 5] },
            { id: 'Q3', label: 'Triwulan 3 (Jul-Sep)', months: [6, 7, 8] },
            { id: 'Q4', label: 'Triwulan 4 (Okt-Des)', months: [9, 10, 11] }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [coachingRecords, setCoachingRecords] = useState([]);
            const [studentsList, setStudentsList] = useState(INITIAL_STUDENTS);
            
            const [teacherProfile, setTeacherProfile] = useState({
                name: 'Muhammad Riansyah, M.Pd.',
                nip: '1431069',
                kelas: 'VII D'
            });

            const [newStudent, setNewStudent] = useState({ name: '', nis: '' });
            
            const [formData, setFormData] = useState({
                studentId: '',
                date: new Date().toISOString().split('T')[0],
                aspek: 'kompetensi',
                indikator: '',
                target: '',
                hasil: '',
                tindakLanjut: ''
            });

            const [selectedWeekStart, setSelectedWeekStart] = useState(() => {
                const d = new Date();
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                return new Date(d.setDate(diff)).toISOString().split('T')[0];
            });

            const [selectedTriwulan, setSelectedTriwulan] = useState(() => {
                const currentMonth = new Date().getMonth();
                return TRIWULAN.find(t => t.months.includes(currentMonth))?.id || 'Q1';
            });

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                if (name === 'aspek') setFormData(prev => ({ ...prev, indikator: '' }));
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudent.name.trim() || !newStudent.nis.trim()) return;
                setStudentsList(prev => [...prev, { id: `S${Date.now()}`, name: newStudent.name.trim(), nis: newStudent.nis.trim() }]);
                setNewStudent({ name: '', nis: '' });
            };

            const handleDeleteStudent = (id) => {
                if (confirm('Apakah Anda yakin ingin menghapus siswa ini?')) {
                    setStudentsList(prev => prev.filter(s => s.id !== id));
                }
            };

            const handleProfileChange = (e) => {
                const { name, value } = e.target;
                setTeacherProfile(prev => ({ ...prev, [name]: value }));
            };

            const handleAddRecord = (e) => {
                e.preventDefault();
                const newRecord = { id: Date.now().toString(), ...formData, timestamp: new Date().toISOString() };
                setCoachingRecords([newRecord, ...coachingRecords]);
                setFormData(prev => ({ ...prev, studentId: '', indikator: '', target: '', hasil: '', tindakLanjut: '' }));
                alert('Data pembinaan berhasil disimpan!');
            };

            const deleteRecord = (id) => {
                if (confirm('Hapus catatan pembinaan ini?')) {
                    setCoachingRecords(coachingRecords.filter(r => r.id !== id));
                }
            };

            const renderDashboard = () => {
                const aspekCount = { kompetensi: 0, akademik: 0, karakter: 0, keterampilan: 0 };
                coachingRecords.forEach(r => { if (aspekCount[r.aspek] !== undefined) aspekCount[r.aspek]++; });

                const barChartData = Object.keys(ASPEK_PEMBINAAN).map(key => ({
                    name: ASPEK_PEMBINAAN[key].label,
                    jumlah: aspekCount[key],
                    fill: ASPEK_PEMBINAAN[key].color
                }));

                const pieChartData = barChartData.filter(d => d.jumlah > 0);
                const COLORS = pieChartData.map(d => d.fill);

                return (
                    <div className="space-y-6">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Dashboard Utama</h2>
                            <p className="text-gray-500 text-sm mt-1">Ringkasan aktivitas Guru Wali kelas {teacherProfile.kelas}</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            {Object.values(ASPEK_PEMBINAAN).map(aspek => (
                                <div key={aspek.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
                                    <div className={`p-3 rounded-lg ${aspek.bgColor}`}>
                                        <Icon name={aspek.iconName} className={`w-6 h-6 ${aspek.text}`} />
                                    </div>
                                    <div>
                                        <p className="text-sm font-medium text-gray-500">{aspek.label}</p>
                                        <h3 className="text-2xl font-bold text-gray-800">{aspekCount[aspek.id]}</h3>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                <h3 className="text-lg font-semibold text-gray-700 mb-4">Distribusi Aspek Pembinaan</h3>
                                <div className="h-64">
                                    {coachingRecords.length > 0 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={barChartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                                <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 12}} />
                                                <YAxis axisLine={false} tickLine={false} tick={{fontSize: 12}} allowDecimals={false} />
                                                <RechartsTooltip cursor={{fill: '#f3f4f6'}} contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                                                <Bar dataKey="jumlah" radius={[4, 4, 0, 0]} maxBarSize={50}>
                                                    {barChartData.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={entry.fill} />
                                                    ))}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    ) : (
                                        <div className="h-full flex items-center justify-center text-gray-400 text-sm">Belum ada data pembinaan</div>
                                    )}
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                <h3 className="text-lg font-semibold text-gray-700 mb-4">Persentase Fokus</h3>
                                <div className="h-64">
                                    {pieChartData.length > 0 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={pieChartData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="jumlah">
                                                    {pieChartData.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                    ))}
                                                </Pie>
                                                <RechartsTooltip contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                                                <Legend verticalAlign="bottom" height={36} iconType="circle" wrapperStyle={{fontSize: '12px'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    ) : (
                                        <div className="h-full flex items-center justify-center text-gray-400 text-sm">Belum ada data pembinaan</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderInputForm = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800 border-b pb-2">Catat Data Pembinaan</h2>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <form onSubmit={handleAddRecord} className="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                                <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Siswa Binaan</label>
                                <select name="studentId" value={formData.studentId} onChange={handleInputChange} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                                    <option value="">-- Pilih Siswa --</option>
                                    {studentsList.map(s => (<option key={s.id} value={s.id}>{s.name} ({s.nis})</option>))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Aspek Pembinaan</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {Object.values(ASPEK_PEMBINAAN).map(aspek => (
                                        <label key={aspek.id} className={`flex items-center p-2 border rounded-lg cursor-pointer ${formData.aspek === aspek.id ? `${aspek.bgColor} ring-1 ring-green-600` : 'border-gray-200'}`}>
                                            <input type="radio" name="aspek" value={aspek.id} checked={formData.aspek === aspek.id} onChange={handleInputChange} className="sr-only" />
                                            <Icon name={aspek.iconName} className={`w-4 h-4 mr-2 ${formData.aspek === aspek.id ? aspek.text : 'text-gray-400'}`} />
                                            <span className="text-xs font-medium text-gray-800">{aspek.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Indikator / Topik</label>
                                <select name="indikator" value={formData.indikator} onChange={handleInputChange} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                                    <option value="">-- Pilih Indikator --</option>
                                    {INDIKATOR_PRESET[formData.aspek]?.map((ind, idx) => (<option key={idx} value={ind}>{ind}</option>))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Target Pembinaan</label>
                                <textarea name="target" value={formData.target} onChange={handleInputChange} rows="2" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" required></textarea>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Hasil Observasi</label>
                                <textarea name="hasil" value={formData.hasil} onChange={handleInputChange} rows="2" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" required></textarea>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tindak Lanjut</label>
                                <textarea name="tindakLanjut" value={formData.tindakLanjut} onChange={handleInputChange} rows="2" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" required></textarea>
                            </div>

                            <button type="submit" className="w-full py-2.5 bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg flex justify-center items-center">
                                <Icon name="save" className="w-4 h-4 mr-2" /> Simpan Catatan
                            </button>
                        </form>

                        <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <h3 className="text-lg font-semibold text-gray-700 mb-4">Riwayat Catatan ({coachingRecords.length})</h3>
                            <div className="space-y-3 max-h-[600px] overflow-y-auto">
                                {coachingRecords.length === 0 ? (
                                    <p className="text-gray-400 text-sm text-center py-8">Belum ada catatan pembinaan.</p>
                                ) : (
                                    coachingRecords.map(record => {
                                        const student = studentsList.find(s => s.id === record.studentId);
                                        const aspek = ASPEK_PEMBINAAN[record.aspek];
                                        return (
                                            <div key={record.id} className="p-4 border border-gray-100 rounded-lg bg-gray-50 flex justify-between items-start">
                                                <div>
                                                    <div className="flex items-center space-x-2">
                                                        <span className={`px-2 py-0.5 text-xs font-semibold rounded ${aspek?.bgColor} ${aspek?.text}`}>{aspek?.label}</span>
                                                        <span className="font-semibold text-gray-800 text-sm">{student?.name || 'Siswa Dihapus'}</span>
                                                    </div>
                                                    <p className="text-xs text-gray-500 mt-1">Target: {record.target}</p>
                                                    <p className="text-xs text-gray-600 mt-0.5">Tindak Lanjut: {record.tindakLanjut}</p>
                                                </div>
                                                <button onClick={() => deleteRecord(record.id)} className="text-red-500 hover:text-red-700 p-1">
                                                    <Icon name="trash" className="w-4 h-4" />
                                                </button>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderPengaturan = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800 border-b pb-2">Pengaturan Profil & Siswa</h2>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Edit Teacher Profile */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                            <div className="flex items-center space-x-3 mb-2 pb-2 border-b">
                                <Icon name="user" className="w-6 h-6 text-green-700" />
                                <h3 className="text-lg font-semibold text-gray-700">Profil Guru Wali</h3>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap & Gelar</label>
                                <input 
                                    type="text" 
                                    name="name" 
                                    value={teacherProfile.name} 
                                    onChange={handleProfileChange} 
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" 
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">NIP/NBM</label>
                                <input 
                                    type="text" 
                                    name="nip" 
                                    value={teacherProfile.nip} 
                                    onChange={handleProfileChange} 
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" 
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Wali Kelas</label>
                                <input 
                                    type="text" 
                                    name="kelas" 
                                    value={teacherProfile.kelas} 
                                    onChange={handleProfileChange} 
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" 
                                />
                            </div>
                            <div className="bg-green-50 p-3 rounded-lg text-xs text-green-800">
                                Perubahan data profil guru akan otomatis tercetak di lembar RPP dan Laporan.
                            </div>
                        </div>

                        {/* Add and Manage Students */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                            <div className="flex items-center justify-between mb-2 pb-2 border-b">
                                <div className="flex items-center space-x-3">
                                    <Icon name="users" className="w-6 h-6 text-green-700" />
                                    <h3 className="text-lg font-semibold text-gray-700">Daftar Siswa Binaan</h3>
                                </div>
                                <span className="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                                    Total: {studentsList.length}
                                </span>
                            </div>

                            <form onSubmit={handleAddStudent} className="flex gap-2">
                                <input 
                                    type="text" 
                                    placeholder="NIS" 
                                    value={newStudent.nis} 
                                    onChange={(e) => setNewStudent({...newStudent, nis: e.target.value})} 
                                    className="w-1/3 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" 
                                    required 
                                />
                                <input 
                                    type="text" 
                                    placeholder="Nama Siswa" 
                                    value={newStudent.name} 
                                    onChange={(e) => setNewStudent({...newStudent, name: e.target.value})} 
                                    className="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm" 
                                    required 
                                />
                                <button type="submit" className="px-4 py-2 bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg text-sm flex items-center">
                                    <Icon name="plus" className="w-4 h-4" />
                                </button>
                            </form>

                            <div className="max-h-80 overflow-y-auto space-y-2 pt-2">
                                {studentsList.map(s => (
                                    <div key={s.id} className="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg border border-gray-100">
                                        <div>
                                            <p className="font-medium text-sm text-gray-800">{s.name}</p>
                                            <p className="text-xs text-gray-500">NIS: {s.nis}</p>
                                        </div>
                                        <button onClick={() => handleDeleteStudent(s.id)} className="text-red-500 hover:text-red-700 p-1" title="Hapus Siswa">
                                            <Icon name="trash" className="w-4 h-4" />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderRencanaPekan = () => {
                const weekStart = new Date(selectedWeekStart);
                const weekEnd = new Date(weekStart);
                weekEnd.setDate(weekEnd.getDate() + 6);
                const dateStr = `${weekStart.toLocaleDateString('id-ID', {day:'numeric', month:'short'})} - ${weekEnd.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'})}`;

                return (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center print:hidden">
                            <h2 className="text-2xl font-bold text-gray-800">RPP Guru Wali</h2>
                            <button onClick={() => window.print()} className="px-4 py-2 bg-green-700 text-white rounded-lg flex items-center hover:bg-green-800 text-sm">
                                <Icon name="printer" className="w-4 h-4 mr-2" /> Cetak PDF
                            </button>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-8 print:p-0 print:border-none print:shadow-none">
                            <div className="text-center border-b-2 border-gray-800 pb-4 mb-6">
                                <h1 className="text-lg font-bold uppercase">MAJELIS PENDIDIKAN DASAR DAN MENENGAH</h1>
                                <h2 className="text-xl font-bold uppercase">SMP MUHAMMADIYAH 3 BANDAR LAMPUNG</h2>
                                <p className="text-xs text-gray-600">Jl. Zainal Abidin Pagar Alam No. 14, Labuhan Ratu, Bandar Lampung</p>
                            </div>

                            <div className="text-center mb-6">
                                <h3 className="text-md font-bold uppercase underline">RENCANA PELAKSANAAN PEMBINAAN (RPP) WALI KELAS</h3>
                                <p className="text-xs mt-1">Kelas: <strong>{teacherProfile.kelas}</strong> | Periode: <strong>{dateStr}</strong></p>
                            </div>

                            <table className="w-full text-xs border-collapse border border-gray-300">
                                <thead>
                                    <tr className="bg-gray-100">
                                        <th className="border p-2">No</th>
                                        <th className="border p-2">Siswa</th>
                                        <th className="border p-2">Aspek</th>
                                        <th className="border p-2">Target</th>
                                        <th className="border p-2">Tindak Lanjut</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {coachingRecords.length === 0 ? (
                                        <tr><td colSpan="5" className="border p-4 text-center text-gray-500 italic">Belum ada data pembinaan pekan ini.</td></tr>
                                    ) : (
                                        coachingRecords.map((r, i) => {
                                            const student = studentsList.find(s => s.id === r.studentId);
                                            return (
                                                <tr key={r.id}>
                                                    <td className="border p-2 text-center">{i + 1}</td>
                                                    <td className="border p-2 font-medium">{student?.name || '-'}</td>
                                                    <td className="border p-2 text-center">{ASPEK_PEMBINAAN[r.aspek]?.label}</td>
                                                    <td className="border p-2">{r.target}</td>
                                                    <td className="border p-2">{r.tindakLanjut}</td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>

                            <div className="mt-12 flex justify-between px-8 text-xs text-center">
                                <div>
                                    <p className="mb-12">Mengetahui,<br/>Kepala Sekolah</p>
                                    <p className="font-bold underline">Drs. Nur Salim</p>
                                </div>
                                <div>
                                    <p className="mb-12">Bandar Lampung, {new Date().toLocaleDateString('id-ID')}<br/>Guru Wali Kelas</p>
                                    <p className="font-bold underline">{teacherProfile.name}</p>
                                    <p>NBM/NIP. {teacherProfile.nip}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderLaporanTriwulan = () => {
                const qInfo = TRIWULAN.find(t => t.id === selectedTriwulan);
                const qRecords = coachingRecords.filter(r => {
                    const m = new Date(r.date).getMonth();
                    return qInfo ? qInfo.months.includes(m) : true;
                });

                const studentSet = new Set();
                qRecords.forEach(r => studentSet.add(r.studentId));

                return (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center print:hidden">
                            <h2 className="text-2xl font-bold text-gray-800">Laporan Triwulan</h2>
                            <div className="flex items-center space-x-3">
                                <select value={selectedTriwulan} onChange={(e) => setSelectedTriwulan(e.target.value)} className="px-3 py-2 border rounded-lg text-sm bg-white outline-none">
                                    {TRIWULAN.map(t => (<option key={t.id} value={t.id}>{t.label}</option>))}
                                </select>
                                <button onClick={() => window.print()} className="px-4 py-2 bg-green-700 text-white rounded-lg flex items-center hover:bg-green-800 text-sm">
                                    <Icon name="printer" className="w-4 h-4 mr-2" /> Cetak PDF
                                </button>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-8 print:p-0 print:border-none print:shadow-none">
                            <div className="text-center border-b-2 border-gray-800 pb-4 mb-6">
                                <h1 className="text-lg font-bold uppercase">MAJELIS PENDIDIKAN DASAR DAN MENENGAH</h1>
                                <h2 className="text-xl font-bold uppercase">SMP MUHAMMADIYAH 3 BANDAR LAMPUNG</h2>
                                <p className="text-xs text-gray-600">Jl. Zainal Abidin Pagar Alam No. 14, Labuhan Ratu, Bandar Lampung</p>
                            </div>

                            <div className="text-center mb-6">
                                <h3 className="text-md font-bold uppercase underline">LAPORAN EVALUASI PEMBINAAN SISWA</h3>
                                <p className="text-xs mt-1">
                                    Guru Wali: <strong>{teacherProfile.name}</strong> | Kelas: <strong>{teacherProfile.kelas}</strong> <br/>
                                    Periode: <strong>{qInfo?.label}</strong>
                                </p>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div className="border p-3 rounded-lg text-center bg-gray-50">
                                    <p className="text-xs text-gray-500">Total Sesi Pembinaan</p>
                                    <p className="text-xl font-bold text-gray-800">{qRecords.length}</p>
                                </div>
                                <div className="border p-3 rounded-lg text-center bg-green-50">
                                    <p className="text-xs text-gray-500">Siswa Binaan</p>
                                    <p className="text-xl font-bold text-green-700">{studentSet.size} / {studentsList.length}</p>
                                </div>
                            </div>

                            <table className="w-full text-xs border-collapse border border-gray-300">
                                <thead>
                                    <tr className="bg-gray-100">
                                        <th className="border p-2">Siswa</th>
                                        <th className="border p-2">Aspek & Topik</th>
                                        <th className="border p-2">Tindak Lanjut Utama</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {qRecords.length === 0 ? (
                                        <tr><td colSpan="3" className="border p-4 text-center text-gray-500 italic">Belum ada data pembinaan pada triwulan ini.</td></tr>
                                    ) : (
                                        qRecords.map(r => {
                                            const s = studentsList.find(item => item.id === r.studentId);
                                            return (
                                                <tr key={r.id}>
                                                    <td className="border p-2 font-medium">{s?.name || '-'}</td>
                                                    <td className="border p-2"><strong>{ASPEK_PEMBINAAN[r.aspek]?.label}</strong>: {r.indikator}</td>
                                                    <td className="border p-2">{r.tindakLanjut}</td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>

                            <div className="mt-12 flex justify-between px-8 text-xs text-center">
                                <div>
                                    <p className="mb-12">Mengetahui,<br/>Kepala Sekolah</p>
                                    <p className="font-bold underline">Drs. Nur Salim</p>
                                </div>
                                <div>
                                    <p className="mb-12">Bandar Lampung, {new Date().toLocaleDateString('id-ID')}<br/>Guru Wali Kelas</p>
                                    <p className="font-bold underline">{teacherProfile.name}</p>
                                    <p>NBM/NIP. {teacherProfile.nip}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    <header className="bg-green-800 text-white shadow-md print:hidden">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <Icon name="book" className="w-7 h-7 text-green-200" />
                                <div>
                                    <h1 className="text-lg font-bold leading-tight">BinaWali SMP Muga</h1>
                                    <p className="text-xs text-green-200">Sistem Pembinaan Guru Wali</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2 text-sm bg-green-900 px-3 py-1 rounded-full border border-green-700">
                                <Icon name="user" className="w-4 h-4" />
                                <span>{teacherProfile.name.split(',')[0]} ({teacherProfile.kelas})</span>
                            </div>
                        </div>
                    </header>

                    <div className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">
                        <aside className="w-full md:w-60 shrink-0 print:hidden">
                            <div className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-1">
                                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium ${activeTab === 'dashboard' ? 'bg-green-50 text-green-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <Icon name="chart" className="w-4 h-4" /> <span>Dashboard</span>
                                </button>
                                <button onClick={() => setActiveTab('input')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium ${activeTab === 'input' ? 'bg-green-50 text-green-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <Icon name="plus" className="w-4 h-4" /> <span>Catat Pembinaan</span>
                                </button>
                                <button onClick={() => setActiveTab('pengaturan')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium ${activeTab === 'pengaturan' ? 'bg-green-50 text-green-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <Icon name="settings" className="w-4 h-4" /> <span>Kelola Profil & Siswa</span>
                                </button>
                                <button onClick={() => setActiveTab('rpp_pekan')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium ${activeTab === 'rpp_pekan' ? 'bg-green-50 text-green-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <Icon name="calendar" className="w-4 h-4" /> <span>RPP Pekanan</span>
                                </button>
                                <button onClick={() => setActiveTab('laporan_triwulan')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium ${activeTab === 'laporan_triwulan' ? 'bg-green-50 text-green-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <Icon name="fileText" className="w-4 h-4" /> <span>Laporan Triwulan</span>
                                </button>
                            </div>
                        </aside>

                        <main className="flex-1">
                            {activeTab === 'dashboard' && renderDashboard()}
                            {activeTab === 'input' && renderInputForm()}
                            {activeTab === 'pengaturan' && renderPengaturan()}
                            {activeTab === 'rpp_pekan' && renderRencanaPekan()}
                            {activeTab === 'laporan_triwulan' && renderLaporanTriwulan()}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
